<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Profesores - Biblioteca Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-section" class="login-section">
        <div class="login-container">
            <div class="login-box">
                <h1>🔐 Acceso Profesores</h1>
                <p>Biblioteca Digital - Carrera de Estadística</p>
                
                <form onsubmit="loginProfesor(event)">
                    <div class="form-group">
                        <label for="usuario">Usuario:</label>
                        <input type="text" id="usuario" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="contraseña">Contraseña:</label>
                        <input type="password" id="contraseña" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Ingresar</button>
                </form>
                
                <div id="login-error" style="display: none; margin-top: 15px;" class="alert alert-error"></div>
                
                <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">
                
                <a href="index.html" class="btn btn-secondary" style="width: 100%; text-align: center;">Volver a la Biblioteca</a>
            </div>
        </div>
    </div>

    <div id="admin-section" style="display: none;">
        <div class="admin-container">
            <!-- Encabezado -->
            <div class="admin-header">
                <div>
                    <h1>📚 Panel de Administración</h1>
                    <p id="profesor-nombre" style="margin-top: 5px; opacity: 0.9;"></p>
                </div>
                <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
            </div>

            <!-- Navegación por tabs -->
            <div class="tabs" style="margin-bottom: 20px;">
                <button class="tab-btn active" onclick="cambiarTab('subir')">Subir Libro</button>
                <button class="tab-btn" onclick="cambiarTab('mis-libros')">Mis Libros</button>
                <button class="tab-btn" onclick="cambiarTab('estadisticas')">Estadísticas</button>
            </div>

            <!-- Tab: Subir Libro -->
            <div id="tab-subir" class="tab-content active">
                <div class="admin-content">
                    <h2>Subir Nuevo Libro</h2>
                    
                    <form id="form-libro" onsubmit="subirLibro(event)">
                        <div class="form-group">
                            <label for="titulo">Título del Libro *</label>
                            <input type="text" id="titulo" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="autor">Autor *</label>
                                <input type="text" id="autor" required>
                            </div>

                            <div class="form-group">
                                <label for="año">Año de Publicación</label>
                                <input type="number" id="año" min="1900" max="2099">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="ciclo">Ciclo *</label>
                                <select id="ciclo" required onchange="cargarCursos()">
                                    <option value="">Seleccione un ciclo</option>
                                    <option value="1">I Ciclo</option>
                                    <option value="2">II Ciclo</option>
                                    <option value="3">III Ciclo</option>
                                    <option value="4">IV Ciclo</option>
                                    <option value="5">V Ciclo</option>
                                    <option value="6">VI Ciclo</option>
                                    <option value="7">VII Ciclo</option>
                                    <option value="8">VIII Ciclo</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="curso">Curso *</label>
                                <select id="curso" required>
                                    <option value="">Seleccione un curso</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="isbn">ISBN</label>
                                <input type="text" id="isbn">
                            </div>

                            <div class="form-group">
                                <label for="archivo">Archivo PDF *</label>
                                <input type="file" id="archivo" accept=".pdf" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="descripcion">Descripción</label>
                            <textarea id="descripcion" placeholder="Describa brevemente el contenido del libro..."></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-success">Subir Libro</button>
                            <button type="reset" class="btn btn-secondary">Limpiar Formulario</button>
                        </div>
                    </form>

                    <div id="upload-message" style="display: none; margin-top: 20px;"></div>
                </div>
            </div>

            <!-- Tab: Mis Libros -->
            <div id="tab-mis-libros" class="tab-content" style="display: none;">
                <div class="admin-content">
                    <h2>Mis Libros Subidos</h2>
                    <div id="mis-libros-container">
                        <p style="text-align: center; color: #999;">Cargando...</p>
                    </div>
                </div>
            </div>

            <!-- Tab: Estadísticas -->
            <div id="tab-estadisticas" class="tab-content" style="display: none;">
                <div class="admin-content">
                    <h2>Estadísticas</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Total de Libros</h3>
                            <p class="stat-number" id="stat-total-libros">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Mis Libros</h3>
                            <p class="stat-number" id="stat-mis-libros">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Descargas Totales</h3>
                            <p class="stat-number" id="stat-descargas">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .login-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
        }

        .login-box h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            margin-bottom: -12px;
        }

        .tab-btn:hover {
            color: #2c3e50;
        }

        .tab-btn.active {
            color: #3498db;
            border-color: #3498db;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .libro-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            border-left: 4px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .libro-info h4 {
            margin-bottom: 5px;
        }

        .libro-info p {
            font-size: 0.9em;
            color: #666;
            margin: 2px 0;
        }

        .libro-actions {
            display: flex;
            gap: 10px;
        }

        .libro-actions .btn {
            padding: 8px 15px;
            font-size: 0.85em;
        }
    </style>

    <script src="admin_script.js"></script>
</body>
</html>
